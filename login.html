<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Demha</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
   <header class="global-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
            <img src="images/logo.png" alt="Demha Logo" class="brand-logo">
            <span style="color: #000 !important; font-weight: 800; font-size: 22px; font-family: sans-serif;">Demha</span>
        </a>
    </header>

    <div class="login-container">
        <h2>Welcome Back</h2>
        <p class="brand-subtitle">Sign in to your Demha account</p>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" required placeholder="name@business.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
